<section class="flex min-h-[calc(100vh-6rem)] items-center justify-center px-4 py-8">
  <form class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm" (ngSubmit)="submit()">
    <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Verdelak</p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-950">Sign in</h1>
    <p class="mt-2 text-sm text-slate-600">Enter your account credentials to continue.</p>

    <div *ngIf="error()" class="mt-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-800">
      {{ error() }}
    </div>

    <div class="mt-5 grid gap-4">
      <label class="grid gap-1 text-sm font-semibold text-slate-700">
        Username
        <input
          class="rounded-md border border-slate-300 px-3 py-2 text-sm font-normal shadow-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          type="text"
          autocomplete="username"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
        />
      </label>

      <label class="grid gap-1 text-sm font-semibold text-slate-700">
        Password
        <input
          class="rounded-md border border-slate-300 px-3 py-2 text-sm font-normal shadow-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          type="password"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
      </label>

      <button
        type="submit"
        class="rounded-md bg-blue-600 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-blue-700 disabled:cursor-wait disabled:opacity-60"
        [disabled]="loading()"
      >
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </div>
  </form>
</section>
