<section class="grid gap-4">
  <header class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
    <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Books</p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl">Want List</h1>
    <p class="mt-1 text-sm text-slate-600">{{ sortedItems().length }} wanted books</p>
  </header>

  <div *ngIf="error()" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800">{{ error() }}</div>

  <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200 text-sm">
        <thead class="bg-slate-50 text-left text-xs font-bold uppercase text-slate-600">
          <tr>
            <th class="px-4 py-3"><button type="button" class="font-bold hover:text-blue-700" (click)="sortBy('author')">Author <span class="normal-case text-slate-400">{{ sortLabel('author') }}</span></button></th>
            <th class="px-4 py-3"><button type="button" class="font-bold hover:text-blue-700" (click)="sortBy('title')">Title <span class="normal-case text-slate-400">{{ sortLabel('title') }}</span></button></th>
            <th class="px-4 py-3"><button type="button" class="font-bold hover:text-blue-700" (click)="sortBy('series')">Series <span class="normal-case text-slate-400">{{ sortLabel('series') }}</span></button></th>
            <th class="px-4 py-3"><button type="button" class="font-bold hover:text-blue-700" (click)="sortBy('format')">Format <span class="normal-case text-slate-400">{{ sortLabel('format') }}</span></button></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr *ngFor="let item of sortedItems()" class="hover:bg-blue-50/60">
            <td class="px-4 py-3 font-semibold text-slate-900">{{ item.author }}</td>
            <td class="px-4 py-3 text-slate-700">{{ item.title }}</td>
            <td class="px-4 py-3 text-slate-700">{{ displaySeries(item) || '-' }}</td>
            <td class="px-4 py-3"><span class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-bold text-indigo-700">{{ item.format }}</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="sortedItems().length === 0 && !loading()" class="border-t border-slate-200 p-8 text-center text-sm text-slate-500">
      No wanted books found.
    </div>
    <div *ngIf="loading()" class="border-t border-slate-200 p-8 text-center text-sm font-medium text-slate-500">
      Loading want list...
    </div>
  </section>
</section>
