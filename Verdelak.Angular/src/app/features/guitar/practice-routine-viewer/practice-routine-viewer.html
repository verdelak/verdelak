<section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
  <h2 class="text-sm font-bold uppercase text-slate-600">Practice Routine</h2>
  <div class="mt-3 grid gap-3 lg:grid-cols-2">
    <article *ngFor="let routine of routines" class="rounded-md border border-slate-200 p-3">
      <p class="text-xs font-bold uppercase text-blue-600">{{ routine.focus }}</p>
      <h3 class="mt-1 text-base font-bold text-slate-950">{{ routine.title }}</h3>
      <ol class="mt-3 grid list-decimal gap-2 ps-5 text-sm text-slate-700">
        <li *ngFor="let step of routine.steps">{{ step }}</li>
      </ol>
    </article>
  </div>
</section>
