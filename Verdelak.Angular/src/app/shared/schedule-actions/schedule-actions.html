<label *ngIf="showActionNotes" class="mt-3 grid gap-1 text-xs font-bold uppercase text-slate-600">
  Action note
  <textarea
    class="min-h-20 rounded border border-slate-300 bg-white px-2 py-1.5 text-sm font-normal normal-case text-slate-900"
    name="scheduleActionNote"
    placeholder="Optional note for this action"
    [ngModel]="actionNote"
    (ngModelChange)="actionNoteChange.emit($event)"></textarea>
</label>

<div class="mt-3 flex flex-wrap gap-2">
  <button *ngIf="capabilities.canComplete" type="button" class="rounded bg-emerald-700 px-3 py-1.5 text-xs font-bold text-white disabled:opacity-50" [disabled]="actionDisabled" (click)="complete.emit(noteValue())">Done</button>
  <button *ngIf="capabilities.canMove" type="button" class="rounded border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 disabled:opacity-50" [disabled]="actionDisabled" (click)="startMove.emit()">Reschedule</button>
  <button *ngIf="capabilities.canSkip" type="button" class="rounded border border-amber-200 bg-white px-3 py-1.5 text-xs font-bold text-amber-800 disabled:opacity-50" [disabled]="actionDisabled" (click)="skip.emit(noteValue())">Skip</button>
  <button *ngIf="capabilities.canReopen" type="button" class="rounded border border-lime-200 bg-lime-50 px-3 py-1.5 text-xs font-bold text-lime-800 disabled:opacity-50" [disabled]="actionDisabled" (click)="reopen.emit(noteValue())">Reopen</button>
</div>

<form *ngIf="moving" class="mt-3 grid grid-cols-[minmax(0,1fr)_auto_auto] gap-2" (ngSubmit)="move.emit(noteValue())">
  <input type="date" name="scheduleMoveDate" class="min-w-0 rounded border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-900" [ngModel]="moveDate" (ngModelChange)="moveDateChange.emit($event)">
  <button type="submit" [class]="moveButtonClass" [disabled]="actionDisabled || !moveDate">Save</button>
  <button type="button" class="rounded border border-slate-300 bg-white px-3 py-1.5 text-xs font-bold text-slate-700" (click)="cancelMove.emit()">Cancel</button>
</form>
