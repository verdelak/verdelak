<section class="edit">
  <header class="head">
    <h2>{{ isEdit ? 'Edit Product' : 'Add Product' }}</h2>
    <a class="btn btn-outline-secondary btn-sm" [routerLink]="['/rpg']">Back</a>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label class="form-field">
      <span>Product Name</span>
      <input class="form-control" formControlName="productName" required />
    </label>

    <label class="form-field">
      <span>Description</span>
      <textarea class="form-control" rows="3" formControlName="description"></textarea>
    </label>

    <div class="row">
      <label class="form-field">
        <span>System</span>
        <select class="form-select" formControlName="systemID">
          <option [ngValue]="null">-</option>
          <option *ngFor="let s of systems" [ngValue]="s.id">{{ s.name }}</option>
        </select>
      </label>

      <label class="form-field">
        <span>Series</span>
        <select class="form-select" formControlName="seriesID">
          <option [ngValue]="null">-</option>
          <option *ngFor="let s of series" [ngValue]="s.id">{{ s.name }}</option>
        </select>
      </label>

      <label class="form-field">
        <span>Type</span>
        <select class="form-select" formControlName="productTypeID">
          <option [ngValue]="null">-</option>
          <option *ngFor="let t of types" [ngValue]="t.id">{{ t.name }}</option>
        </select>
      </label>
    </div>

    <div class="row">
      <label class="form-field">
        <span>Edition</span>
        <input class="form-control" formControlName="edition" />
      </label>

      <label class="form-field">
        <span>ISBN</span>
        <input class="form-control" formControlName="isbn" />
      </label>

      <label class="form-field">
        <span>Product #</span>
        <input class="form-control" formControlName="productNum" />
      </label>
    </div>

    <div class="row">
      <label class="form-field">
        <span>Status</span>
        <select class="form-select" formControlName="status">
          <option value="H">Owned</option>
          <option value="W">Wanted</option>
          <option value="">Unknown</option>
        </select>
      </label>
    </div>

    <footer class="actions">
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Save</button>
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Cancel</button>
      <button *ngIf="isEdit" class="btn btn-outline-danger" type="button" (click)="delete()">Delete</button>
    </footer>
  </form>
</section>
