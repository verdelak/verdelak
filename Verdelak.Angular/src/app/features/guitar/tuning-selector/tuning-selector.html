<section class="grid gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="text-sm font-bold uppercase text-slate-600">Instrument</h2>
  </div>

  <div class="grid gap-3 lg:grid-cols-3">
    <div *ngFor="let group of presetGroups" class="rounded-md border border-slate-200 bg-slate-50 p-3">
      <p class="mb-2 text-xs font-bold uppercase text-slate-500">{{ group }}</p>
      <div class="flex flex-wrap gap-2">
        <button
          *ngFor="let preset of presetsByGroup(group)"
          class="rounded-md border px-3 py-1.5 text-xs font-bold"
          [class.border-slate-900]="isPresetActive(preset)"
          [class.bg-slate-900]="isPresetActive(preset)"
          [class.text-white]="isPresetActive(preset)"
          [class.border-slate-300]="!isPresetActive(preset)"
          [class.text-slate-700]="!isPresetActive(preset)"
          type="button"
          [title]="noteList(preset.notes)"
          (click)="presetSelected.emit(preset)"
        >
          {{ preset.label }}
        </button>
      </div>
    </div>
  </div>

  <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
    <label class="grid gap-1 text-xs font-bold uppercase text-slate-500">
      Strings
      <input class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold normal-case text-slate-900" type="number" min="4" max="9" [ngModel]="stringCount" (ngModelChange)="stringCountChange.emit(+$event)">
    </label>
    <label class="grid gap-1 text-xs font-bold uppercase text-slate-500">
      Frets
      <input class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold normal-case text-slate-900" type="number" min="5" max="36" [ngModel]="fretCount" (ngModelChange)="fretCountChange.emit(+$event)">
    </label>
    <label class="grid gap-1 text-xs font-bold uppercase text-slate-500 xl:col-span-2">
      Tuning
      <select class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold normal-case text-slate-900" [ngModel]="tuningName" (ngModelChange)="tuningNameChange.emit($event)">
        <option *ngFor="let tuning of filteredTunings()" [value]="tuning.name">{{ tuning.name }} - {{ noteList(tuning.notes) }}</option>
      </select>
    </label>
  </div>

  <div *ngIf="selectedTuning() as tuning" class="app-token-soft-surface app-token-text-strong rounded-md border px-3 py-2 text-sm">
    <span class="font-bold">{{ tuning.instrument }}:</span>
    <span>{{ tuning.description }}</span>
    <span class="font-semibold"> Low to high: {{ noteList(tuning.notes) }}</span>
  </div>

  <label class="grid gap-1 text-xs font-bold uppercase text-slate-500">
    Custom tuning, low to high
    <input class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold normal-case text-slate-900" placeholder="B E A D G B E" [ngModel]="customTuning" (ngModelChange)="customTuningChange.emit($event)">
    <span class="text-xs font-semibold normal-case text-slate-500">
      Enter 4-9 notes separated by spaces or commas. Flats and sharps both work. Current custom note count: {{ customNoteCount() }}.
    </span>
  </label>
</section>
