<section class="rounded border border-slate-200 bg-white shadow-sm">
  <div class="flex flex-col gap-3 border-b border-slate-200 p-4 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h2 class="text-lg font-bold text-slate-950">Water Reading Trend</h2>
      <p class="text-sm text-slate-600">
        {{ vm.selectedChartTank()?.name || 'No tank selected' }} / {{ vm.chartRangeLabel() }} / {{ vm.chartDateLabel() }}
      </p>
    </div>
    <div class="flex flex-wrap gap-2">
      <select class="rounded border border-slate-300 px-3 py-2 text-sm" [ngModel]="vm.waterChartTankFilter()" (ngModelChange)="vm.waterChartTankFilter.set($event ? +$event : null)">
        <option [ngValue]="null">First active tank</option>
        <option *ngFor="let tank of vm.tanks()" [ngValue]="tank.id">{{ tank.name }}</option>
      </select>
      <select class="rounded border border-slate-300 px-3 py-2 text-sm" [ngModel]="vm.waterChartMetric()" (ngModelChange)="vm.waterChartMetric.set($event)">
        <option value="temperature">Temperature</option>
        <option value="ammonia">Ammonia</option>
        <option value="nitrite">Nitrite</option>
        <option value="nitrate">Nitrate</option>
        <option value="ph">pH</option>
        <option value="gh">GH</option>
        <option value="kh">KH</option>
      </select>
    </div>
  </div>

  <div class="p-4">
    <svg viewBox="0 0 100 100" class="h-56 w-full rounded border border-slate-200 bg-slate-50" preserveAspectRatio="none" role="img">
      <line x1="8" y1="12" x2="8" y2="88" class="stroke-slate-300" stroke-width="0.6"></line>
      <line x1="8" y1="88" x2="92" y2="88" class="stroke-slate-300" stroke-width="0.6"></line>
      <polyline *ngIf="vm.chartLogs().length > 0" [attr.points]="vm.chartPoints()" fill="none" class="stroke-cyan-800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
      <circle *ngFor="let log of vm.chartLogs(); let index = index" [attr.cx]="vm.chartDotX(index)" [attr.cy]="vm.chartDotY(log)" r="1.8" class="fill-cyan-900"></circle>
      <text *ngIf="vm.chartLogs().length === 0" x="50" y="52" text-anchor="middle" class="fill-slate-500 text-[4px]">No readings for this tank and metric</text>
    </svg>
  </div>
</section>
