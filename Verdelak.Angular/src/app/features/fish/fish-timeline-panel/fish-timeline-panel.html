<section class="rounded border border-slate-200 bg-white shadow-sm">
  <div class="flex flex-col gap-3 border-b border-slate-200 p-4 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h2 class="text-lg font-bold text-slate-950">Tank Timeline</h2>
      <p class="text-sm text-slate-600">{{ visibleHistory().length }} history items shown</p>
    </div>
    <select class="rounded border border-slate-300 px-3 py-2 text-sm" [ngModel]="historyTankFilter()" (ngModelChange)="historyTankFilter.set($event ? +$event : null)">
      <option [ngValue]="null">All tanks</option>
      <option *ngFor="let tank of tanks()" [ngValue]="tank.id">{{ tank.name }}</option>
    </select>
  </div>

  <div class="space-y-5 p-4">
    <div *ngFor="let group of historyGroups()" class="border-l-2 border-slate-200 pl-4">
      <h3 class="mb-3 text-sm font-bold uppercase text-slate-500">{{ group.dateLabel }}</h3>
      <div class="space-y-3">
        <article *ngFor="let item of group.items" class="relative rounded border border-slate-200 bg-white p-3 shadow-sm">
          <span class="absolute -left-[23px] top-4 h-3 w-3 rounded-full border-2 border-white bg-slate-400"></span>
          <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="rounded border px-2 py-1 text-xs font-bold" [ngClass]="historyTone(item)">{{ item.kind }}</span>
                <h4 class="text-sm font-bold text-slate-950">{{ item.title }}</h4>
              </div>
              <div class="mt-1 text-sm text-slate-700">{{ item.tankName }}</div>
            </div>
            <div class="whitespace-nowrap text-xs font-semibold text-slate-500">{{ formatDate(item.occurredAt) }}</div>
          </div>

          <div class="mt-3 grid gap-2 text-sm text-slate-700 md:grid-cols-[1fr_1.4fr]">
            <div>
              <span class="font-semibold text-slate-600">Summary:</span>
              {{ historySummary(item) }}
            </div>
            <div>
              <span class="font-semibold text-slate-600">Notes:</span>
              {{ item.notes || '-' }}
            </div>
          </div>
        </article>
      </div>
    </div>

    <div *ngIf="!historyLoading() && historyGroups().length === 0" class="rounded border border-slate-200 px-3 py-8 text-center text-sm text-slate-500">
      No tank history found.
    </div>
    <div *ngIf="historyLoading()" class="rounded border border-slate-200 px-3 py-8 text-center text-sm text-slate-500">
      Loading tank history.
    </div>
  </div>
</section>
