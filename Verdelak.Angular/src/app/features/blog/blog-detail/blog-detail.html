<section class="grid gap-4">
  <a routerLink="/blog" class="w-fit text-sm font-bold transition" [style.color]="appearance().primaryColor">Back to {{ appearance().brandName }}</a>

  <div *ngIf="error()" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800">{{ error() }}</div>

  <article *ngIf="post() as post" class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
    <header>
      <div class="flex flex-wrap items-center gap-3">
        <img *ngIf="appearance().logoUrl as logoUrl" class="h-9 w-9 rounded-md object-contain" [src]="logoUrl" [alt]="appearance().brandName + ' logo'" />
        <div>
          <p class="text-xs font-bold uppercase tracking-wider" [style.color]="appearance().accentColor">{{ appearance().brandName }}</p>
          <p class="mt-1 text-sm font-semibold text-slate-500">{{ post.postedDate | date:'mediumDate' }}</p>
        </div>
      </div>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">{{ post.title }}</h1>
      <p class="mt-2 max-w-3xl text-sm font-medium text-slate-600">{{ appearance().tagline }}</p>
      <img
        *ngIf="appearance().heroImageUrl as heroImageUrl"
        class="mt-4 h-44 w-full rounded-md object-cover sm:h-56"
        [src]="heroImageUrl"
        [alt]="appearance().brandName + ' hero image'"
      />
      <div class="mt-3 flex flex-wrap gap-2">
        <span *ngFor="let tag of post.tags" class="rounded-full px-2.5 py-1 text-xs font-bold" [style.background-color]="appearance().primaryColor + '14'" [style.color]="appearance().primaryColor">{{ tag.name }}</span>
      </div>
    </header>

    <div class="blog-body mt-6 max-w-4xl text-slate-700" [innerHTML]="bodyHtml()"></div>
  </article>
</section>
