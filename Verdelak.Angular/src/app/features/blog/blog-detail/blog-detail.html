<section class="grid gap-4">
  <a routerLink="/blog" class="w-fit text-sm font-bold text-blue-700 transition hover:text-blue-900">Back to Blog</a>

  <div *ngIf="error()" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800">{{ error() }}</div>

  <article *ngIf="post() as post" class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
    <header>
      <p class="text-sm font-semibold text-slate-500">{{ post.postedDate | date:'mediumDate' }}</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-950">{{ post.title }}</h1>
      <div class="mt-3 flex flex-wrap gap-2">
        <span *ngFor="let tag of post.tags" class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-bold text-indigo-700">{{ tag.name }}</span>
      </div>
    </header>

    <div class="blog-body mt-6 max-w-4xl text-slate-700" [innerHTML]="bodyHtml()"></div>
  </article>
</section>
