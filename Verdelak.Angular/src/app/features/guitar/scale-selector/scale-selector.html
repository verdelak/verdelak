<section class="grid gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <h2 class="text-sm font-bold uppercase text-slate-600">Scale</h2>
    <div *ngIf="selectedScale() as scale" class="text-right text-xs font-semibold text-slate-500">
      <span class="block">{{ scale.family }}</span>
      <span class="block">{{ formulaLabel(scale) }}</span>
    </div>
  </div>
  <div class="grid gap-3 sm:grid-cols-3">
    <label class="grid gap-1 text-xs font-bold uppercase text-slate-500">
      Root
      <select class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold normal-case text-slate-900" [ngModel]="rootNote" (ngModelChange)="rootNoteChange.emit($event)">
        <option *ngFor="let note of rootNotes" [value]="note">{{ note }}</option>
      </select>
    </label>
    <label class="grid gap-1 text-xs font-bold uppercase text-slate-500">
      Scale type
      <select class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold normal-case text-slate-900" [ngModel]="scaleType" (ngModelChange)="scaleTypeChange.emit($event)">
        <option *ngFor="let scale of scales" [value]="scale.name">{{ scale.name }}</option>
      </select>
    </label>
    <div class="grid gap-1 text-xs font-bold uppercase text-slate-500">
      Fret labels
      <div class="grid grid-cols-2 overflow-hidden rounded-md border border-slate-300 bg-white text-sm font-bold normal-case">
        <button
          type="button"
          class="px-3 py-2 transition"
          [class.bg-slate-900]="displayMode === 'notes'"
          [class.text-white]="displayMode === 'notes'"
          [class.text-slate-700]="displayMode !== 'notes'"
          title="Show note names on the fretboard"
          (click)="displayModeChange.emit('notes')"
        >
          Notes
        </button>
        <button
          type="button"
          class="border-l border-slate-300 px-3 py-2 transition"
          [class.bg-slate-900]="displayMode === 'intervals'"
          [class.text-white]="displayMode === 'intervals'"
          [class.text-slate-700]="displayMode !== 'intervals'"
          title="Show scale degrees on the fretboard"
          (click)="displayModeChange.emit('intervals')"
        >
          Degrees
        </button>
      </div>
    </div>
  </div>
  <p *ngIf="selectedScale() as scale" class="rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600">
    {{ displayMode === 'notes' ? 'Fretboard labels show note names.' : 'Fretboard labels show scale degrees.' }}
    {{ scale.description }}
  </p>
</section>
