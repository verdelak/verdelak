<section class="grid gap-4">
  <header class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
    <p class="text-xs font-bold uppercase tracking-wider text-blue-600">Personal</p>
    <h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl">Blog</h1>
    <form class="mt-4 grid gap-2 sm:grid-cols-[minmax(0,1fr)_auto_auto]" (ngSubmit)="applySearch()">
      <input class="rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100" type="search" name="search" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Search entries" />
      <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-blue-700">Search</button>
      <button type="button" class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50" (click)="clearFilters()">Clear</button>
    </form>
  </header>

  <div *ngIf="error()" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-800">{{ error() }}</div>

  <div class="grid gap-4 xl:grid-cols-[minmax(0,1fr)_18rem]">
    <section class="grid min-w-0 gap-3">
      <article *ngFor="let post of posts()" class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <a [routerLink]="['/blog', post.slug]" class="text-xl font-bold text-slate-950 transition hover:text-blue-700">{{ post.title }}</a>
            <p class="mt-1 text-sm font-medium text-slate-500">{{ post.postedDate | date:'mediumDate' }}</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button *ngFor="let tag of post.tags" type="button" class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-bold text-indigo-700" (click)="setTag(tag.slug)">{{ tag.name }}</button>
          </div>
        </div>
        <p class="mt-3 text-sm leading-6 text-slate-600">{{ post.excerpt }}</p>
      </article>

      <div *ngIf="posts().length === 0 && !loading()" class="rounded-lg border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-slate-500">
        No blog entries found.
      </div>

      <div class="flex items-center justify-between rounded-lg border border-slate-200 bg-white p-3 shadow-sm">
        <button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50" (click)="previousPage()" [disabled]="!canGoPrevious()">Previous</button>
        <span class="text-sm font-semibold text-slate-600">Page {{ page() }} of {{ totalPages() || 1 }} · {{ totalCount() }} entries</span>
        <button type="button" class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50" (click)="nextPage()" [disabled]="!canGoNext()">Next</button>
      </div>
    </section>

    <aside class="grid h-fit gap-4">
      <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="text-base font-bold text-slate-950">Tags</h2>
        <div class="mt-3 flex flex-wrap gap-2">
          <button *ngFor="let tag of tags()" type="button" class="rounded-full border px-2.5 py-1 text-xs font-bold transition" [class.border-blue-200]="selectedTag() === tag.slug" [class.bg-blue-50]="selectedTag() === tag.slug" [class.text-blue-700]="selectedTag() === tag.slug" [class.border-slate-200]="selectedTag() !== tag.slug" [class.text-slate-600]="selectedTag() !== tag.slug" (click)="setTag(tag.slug)">{{ tag.name }}</button>
        </div>
      </section>

      <section class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="text-base font-bold text-slate-950">Archive</h2>
        <div class="mt-3 grid gap-1">
          <button *ngFor="let item of archive()" type="button" class="flex items-center justify-between rounded-md px-2 py-1.5 text-left text-sm font-semibold text-slate-700 transition hover:bg-slate-100" (click)="setArchive(item)">
            <span>{{ monthName(item.month) }} {{ item.year }}</span>
            <span class="text-slate-400">{{ item.count }}</span>
          </button>
        </div>
      </section>
    </aside>
  </div>
</section>
